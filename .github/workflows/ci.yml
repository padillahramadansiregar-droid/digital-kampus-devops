name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Automated test
        run: npm test

      - name: Cek keamanan dependensi
        run: npm audit --audit-level=high

      - name: Build Docker image
        run: docker build -t digital-kampus:${{ github.sha }} .
